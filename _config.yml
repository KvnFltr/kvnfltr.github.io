title: "Kévin Feltrin"
name: "Kévin Feltrin"
description: "Final-year Data Science & AI engineering student at ESIEE Paris. Research, machine learning and product engineering. Six-month internship from February 2027."
url: "https://kvnfltr.github.io"
baseurl: ""
repository: "KvnFltr/kvnfltr.github.io"
locale: "en-US"
timezone: "Europe/Paris"
encoding: "utf-8"
future: false
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
include:
  - _pages
exclude:
  - resume.pdf
  - .github
  - .devcontainer
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - vendor
  - node_modules
  - scripts
  - Gemfile
  - Gemfile.lock
  - package.json
  - Dockerfile
  - docker-compose.yaml
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - markdown_generator
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - assets/css/main.scss
  - assets/css/academicons.css
  - assets/css/academicons.min.css
  - assets/css/collapse.css
  - assets/fonts
  - assets/webfonts
  - assets/js/_main.js
  - assets/js/main.min.js
  - assets/js/theme.js
  - assets/js/collapse.js
  - assets/js/plugins
  - images/themes
collections:
  portfolio:
    output: true
    permalink: /portfolio/:path/
defaults:
  - scope:
      path: ""
    values:
      layout: portfolio-page
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
